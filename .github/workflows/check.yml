name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate through the development envelope
        run: |
          ./dev bash -c '
            set -e
            node --version
            npm --version
            tofu version
            aws --version
            node --test infrastructure/bootstrap/tests/*.test.mjs
            npm --prefix app test
            npm --prefix app run package
            tofu -chdir=infrastructure fmt -check -recursive
            for root in infrastructure infrastructure/bootstrap/account infrastructure/bootstrap/access; do
              tofu -chdir="$root" init -backend=false -input=false
              tofu -chdir="$root" validate
              tofu -chdir="$root" test
            done
          '
