name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate through the development envelope
        run: |
          ./dev bash -c '
            set -e
            node --version
            npm --version
            tofu version
            aws --version
            npm --prefix app test
            npm --prefix app run package
            tofu -chdir=infrastructure fmt -check
            tofu -chdir=infrastructure init -backend=false
            tofu -chdir=infrastructure validate
          '
